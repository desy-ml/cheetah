name: typecheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1.1"
          pip install -e ".[all]"
          pip install --group lint

      - name: Run pyrefly
        run: pyrefly check
