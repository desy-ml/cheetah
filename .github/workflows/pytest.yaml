name: pytest

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        options: [""]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            options: "-c test_minimum_requirements_constraints.txt"
          - os: macos-latest
            python-version: "3.14"
            options: ""
          - os: windows-latest
            python-version: "3.14"
            options: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1.1"
          pip install -e ".[all]" ${{ matrix.options }}
          pip install --group test

      - name: Test with pytest
        run: |
          pytest --benchmark-skip
