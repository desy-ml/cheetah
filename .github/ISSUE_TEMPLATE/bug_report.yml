name: Bug Report
description: File a bug report to help us improve Cheetah
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues before submitting to check if the bug has already been reported.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducing the bug
      description: Please provide a minimal, self-contained code snippet that reproduces the issue.
      placeholder: |
        ```python
        import cheetah
        # ...
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: System information
      description: Details about your environment.
      value: |
        - OS: 
        - Python version: 
        - Cheetah version: 
        - PyTorch version: 
        - CUDA / GPU (if applicable):
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, error tracebacks, or screenshots about the problem here.
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues and verified this is not a duplicate.
          required: true
        - label: I have read and followed the [AI Policy](https://github.com/desy-ml/cheetah/blob/master/AI_POLICY.md) if AI tools were used to prepare this issue.
          required: false
